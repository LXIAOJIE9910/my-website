}

    margin: 6px 0;
    font-size: 15px;
}

// ============== 每日自动清空 ==============
function checkNewDay() {
    let today = new Date().toLocaleDateString();
    let lastDate = localStorage.getItem("lastSignDate");
    if (lastDate !== today) {
        localStorage.setItem("signData", JSON.stringify([]));
        localStorage.setItem("lastSignDate", today);
    }
}
checkNewDay();

let signList = JSON.parse(localStorage.getItem("signData")) || [];

function refreshRecord() {
    let r = JSON.parse(localStorage.getItem("signData")) || [];
    let recordDom = document.getElementById("record");
    recordDom.innerText = "✅ 已签到人员（共 " + r.length + " 人）：\n" + (r.length ? r.join("\n") : "暂无签到");
    recordDom.style.display = "block";
}

// 根据户主姓名，查询所有家属/子女
function getFamilyMembers(masterName) {
    return userList.filter(item => 
        item.type === "guest" && 
        item.name.includes(masterName)
    );
}

function checkSign() {
    let n = document.getElementById("name").value.trim();
    document.getElementById("err").style.display = "none";
    document.getElementById("info").style.display = "none";

    if (!n) {
        err("请输入姓名");
        return;
    }

    // 查找匹配的人员
    let foundUser = userList.find(item => item.name === n);
    
    if (!foundUser) {
        err("姓名不存在，无法签到");
        return;
    }

    // 确定户主（用于签到记录）
    let masterUser;
    if (foundUser.type === "normal") {
        masterUser = foundUser;
    } else {
        // 家属/嘉宾，提取户主
        let masterName = foundUser.name.replace(/家属|子女|夫人|助理|驾驶员\d*/g, "").trim();
        masterUser = userList.find(item => item.name === masterName && item.type === "normal");
        if (!masterUser) {
            masterUser = foundUser;
        }
    }

    // 添加签到记录
    if (!signList.includes(masterUser.name)) {
        signList.push(masterUser.name);
        localStorage.setItem("signData", JSON.stringify(signList));
    }

    // 显示信息
    showUserInfo(foundUser);
    refreshRecord();
}

function showUserInfo(user) {
    document.getElementById("u_name").innerText = user.name;
    document.getElementById("u_meetingSeat").innerText = user.meetingSeat || "未安排";
    document.getElementById("u_dinnerSeat").innerText = user.dinnerSeat || "未安排";

    let normalNodes = document.querySelectorAll(".show-normal");
    if (user.type === "guest") {
        normalNodes.forEach(el => el.style.display = "none");
    } else {
        normalNodes.forEach(el => el.style.display = "block");
        document.getElementById("u_class").innerText = user.classInfo || "无";
        document.getElementById("u_pay").innerText = user.payInfo || "无";
        document.getElementById("u_size").innerText = user.selfSize || "无"; // 修复这里
        document.getElementById("u_familySize").innerText = user.familySize || "无";
    }

    // 加载家属/子女信息
    let familyList = getFamilyMembers(user.name);
    let familyDom = document.getElementById("familyList");
    familyDom.innerHTML = "";

    if(familyList.length > 0){
        familyDom.innerHTML = `<p style="margin:10px 0;font-weight:bold;">👨‍👩‍👧‍👦 家属/子女信息：</p>`;
        familyList.forEach(f => {
            familyDom.innerHTML += `
                <div class="family-item">
                    ${f.name}｜会议：${f.meetingSeat}｜晚宴：${f.dinnerSeat}
                </div>
            `;
        });
    }

    document.getElementById("info").style.display = "block";
}

function err(t) {
    let e = document.getElementById("err");
    e.innerText = t;
    e.style.display = "block";
}

function showRecord() {
    refreshRecord();
}
